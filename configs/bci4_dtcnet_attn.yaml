# DTCNet + bottleneck self-attention (Milestone 5.11)
#
# Extends DTCNet v2 (Wang et al. 2025) with 2 pre-LN transformer encoder layers
# at the bottleneck (512-dim, T/32 resolution). At training window T=256, bottleneck
# is only 8 timesteps — trivially cheap for self-attention.
#
# Hypothesis: global temporal dependencies at the bottleneck should help the decoder
# reconstruct finger trajectories more accurately than purely local conv receptive fields.
#
# Param budget: ~10.8M (+6.3M over baseline 4.5M). Still much smaller than our
# standalone Transformer (78M).

seed: 42

data:
  task: bci4
  subject: 1
  data_dir: data/fingerflex
  bci4_data_dir: data/bci4
  sr: 1000
  n_targets: 5

preprocessing_lomtev:
  bandpass_lo: 40.0
  bandpass_hi: 300.0
  notch_freqs: [60]
  n_wavelets: 40
  downsample_fs: 100
  time_delay_sec: 0.2
  n_jobs: 1

windowing_lomtev:
  sample_len: 256
  stride: 1

split:
  val_frac: 0.0

model:
  name: dtcnet_attn
  dropout: 0.1
  strides: [2, 2, 2, 2, 2]
  n_attn_layers: 2
  n_attn_heads: 8
  attn_dim_feedforward: 2048

training:
  batch_size: 128
  epochs: 40
  optimizer: adam
  lr: 8.42e-5
  weight_decay: 1.0e-6
  scheduler: reduce_on_plateau
  scheduler_patience: 8
  early_stopping_patience: 20
  grad_clip_max_norm: 1.0
  loss: mse_cosine

evaluation:
  metric: pearson_r
  smooth_sigma_val: 1
  smooth_sigma_test: 1

logging:
  use_wandb: false
  tags: [bci4, dtcnet, attention, bottleneck, milestone5.11]
