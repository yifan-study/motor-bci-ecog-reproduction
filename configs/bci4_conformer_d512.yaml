# Conformer d512 L6 h8 — BCI-IV fullsplit baseline
# Conv stem (k=3) + Conformer blocks (attn + DW-conv k=31) + RoPE
# Params: ~40M (vs 78M vanilla transformer d1024)

seed: 7

data:
  task: bci4
  subject: 1
  data_dir: data/fingerflex
  bci4_data_dir: data/bci4
  sr: 1000
  n_targets: 5

preprocessing_lomtev:
  bandpass_lo: 40.0
  bandpass_hi: 300.0
  notch_freqs: [60]
  n_wavelets: 40
  downsample_fs: 100
  time_delay_sec: 0.2
  n_jobs: 1

windowing_lomtev:
  sample_len: 256
  stride: 1

split:
  val_frac: 0.0

model:
  name: conformer
  d_model: 512
  n_layers: 6
  n_heads: 8
  dim_feedforward: 2048
  conv_kernel_size: 31
  stem_kernel_size: 3
  dropout: 0.2
  channel_dropout_prob: 0.2

training:
  batch_size: 64
  epochs: 50
  optimizer: adam
  lr: 8.42e-5
  weight_decay: 1.0e-6
  scheduler: reduce_on_plateau
  scheduler_patience: 8
  scheduler_factor: 0.5
  early_stopping_patience: 20
  grad_clip_max_norm: 1.0
  loss: mse_cosine

evaluation:
  metric: pearson_r
  smooth_sigma_val: 6
  smooth_sigma_test: 6

logging:
  use_wandb: false
  tags: [bci4, conformer, d512, L6, h8, rope, chdrop, fullsplit]
