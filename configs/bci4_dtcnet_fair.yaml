# DTCNet with fair evaluation (val_frac=0.15)
#
# Same architecture as bci4_dtcnet.yaml (v2, paper-faithful decoder ordering),
# but with 15% validation carve from training data — matches our Transformer
# evaluation protocol for apples-to-apples comparison.
#
# Purpose: isolate architectural advantage from methodological advantage
# (DTCNet paper trains on 100% of data, uses test set for model selection).

seed: 42

data:
  task: bci4
  subject: 1
  data_dir: data/fingerflex
  bci4_data_dir: data/bci4
  sr: 1000
  n_targets: 5

preprocessing_lomtev:
  bandpass_lo: 40.0
  bandpass_hi: 300.0
  notch_freqs: [60]
  n_wavelets: 40
  downsample_fs: 100
  time_delay_sec: 0.2
  n_jobs: 1

windowing_lomtev:
  sample_len: 256
  stride: 1

split:
  val_frac: 0.15              # fair comparison — same as our Transformer

model:
  name: dtcnet
  dropout: 0.1
  strides: [2, 2, 2, 2, 2]

training:
  batch_size: 128
  epochs: 40
  optimizer: adam
  lr: 8.42e-5
  weight_decay: 1.0e-6
  scheduler: reduce_on_plateau
  scheduler_patience: 8
  early_stopping_patience: 20
  grad_clip_max_norm: 1.0
  loss: mse_cosine

evaluation:
  metric: pearson_r
  smooth_sigma_val: 1
  smooth_sigma_test: 1

logging:
  use_wandb: false
  tags: [bci4, dtcnet, fair-eval]
