# Conv-frontend Transformer: DTCNet-style dilated conv encoder → Transformer
# Conv stem: [128, 128, 256] with dilations [1, 2, 3], 2 MaxPool stages → T/4
# Transformer: d512 L6 h8 at T/4 resolution (4× cheaper attention)
# Hypothesis: DTCNet's local inductive bias (dilated convs) + transformer's
# global attention = best of both worlds. ~15M params (vs 78M vanilla d1024).

seed: 7

data:
  task: bci4
  subject: 1
  data_dir: data/fingerflex
  bci4_data_dir: data/bci4
  sr: 1000
  n_targets: 5

preprocessing_lomtev:
  bandpass_lo: 40.0
  bandpass_hi: 300.0
  notch_freqs: [60]
  n_wavelets: 40
  downsample_fs: 100
  time_delay_sec: 0.2
  n_jobs: 1

windowing_lomtev:
  sample_len: 256
  stride: 1

split:
  val_frac: 0.0

model:
  name: conv_transformer
  d_model: 512
  n_layers: 6
  n_heads: 8
  dim_feedforward: 2048
  conv_channels: [128, 128, 256]
  conv_kernels: [7, 7, 5]
  conv_dilations: [1, 2, 3]
  dropout: 0.2
  channel_dropout_prob: 0.2

training:
  batch_size: 64
  epochs: 50
  optimizer: adam
  lr: 8.42e-5
  weight_decay: 1.0e-6
  scheduler: reduce_on_plateau
  scheduler_patience: 8
  scheduler_factor: 0.5
  early_stopping_patience: 20
  grad_clip_max_norm: 1.0
  loss: mse_cosine

evaluation:
  metric: pearson_r
  smooth_sigma_val: 6
  smooth_sigma_test: 6

logging:
  use_wandb: false
  tags: [bci4, conv_transformer, d512, L6, h8, chdrop, fullsplit]
