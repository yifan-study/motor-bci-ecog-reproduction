# Miller 2019 fingerflex transformer — winning BCI-IV config
# d1024 L6 h16 ff4096 + chdrop=0.6 + drop=0.2, seed=7, fullsplit (val=test)
# BCI-IV result: S1=0.776, S2=0.622, S3=0.773, mean=0.723 (beats DTCNet +0.034)

seed: 7

data:
  task: fingerflex
  patient: bp            # One of: bp, cc, ht, jc, jp, mv, wc, wm, zt
  data_dir: data/fingerflex
  sr: 1000
  n_targets: 5

preprocessing_lomtev:
  bandpass_lo: 40.0
  bandpass_hi: 300.0
  notch_freqs: [60, 120, 180]   # 60 Hz + harmonics (US data)
  n_wavelets: 40
  downsample_fs: 100
  time_delay_sec: 0.2
  n_jobs: 1

windowing_lomtev:
  sample_len: 256
  stride: 1

split:
  train_frac: 0.85
  val_frac: 0.15
  test_frac: 0.0   # fullsplit: val=test (matches BCI-IV protocol)

model:
  name: transformer
  d_model: 1024
  n_layers: 6
  n_heads: 16
  dim_feedforward: 4096
  spatial_kernel_size: 1
  dropout: 0.2
  channel_dropout_prob: 0.6
  strides: [1]

training:
  batch_size: 64
  epochs: 50
  optimizer: adam
  lr: 8.42e-5
  weight_decay: 1.0e-6
  scheduler: reduce_on_plateau
  scheduler_patience: 8
  scheduler_factor: 0.5
  early_stopping_patience: 20
  grad_clip_max_norm: 1.0
  loss: mse_cosine

evaluation:
  metric: pearson_r
  smooth_sigma_val: 6
  smooth_sigma_test: 6

logging:
  use_wandb: false
  wandb_project: plact-motor-decoding
  tags: [miller, transformer, d1024, L6, h16, chdrop06, fullsplit]
