# DeepFingerNet v3 — architecture fixes from re-reading paper Fig. 2
#
# Fixes vs v1/v2:
#   1. Decoder kernel_size=3 (was k=1 — zero temporal receptive field)
#   2. Dense output: head takes cat(e0, d01, d02, d03) = 128ch (was 32ch)
#   3. 60 Hz notch (US data, was 50)
#   4. ReduceLROnPlateau (paper used fixed lr=2e-5 → rapid overfitting)
#   5. Full Morlet spectrogram (n_wavelets=40)
#
# Uses official BCI-IV split (val_frac=0.0 → test set as val)

seed: 42

data:
  task: bci4
  subject: 1
  data_dir: data/fingerflex
  bci4_data_dir: data/bci4
  sr: 1000
  n_targets: 5

preprocessing_lomtev:
  bandpass_lo: 40.0
  bandpass_hi: 300.0
  notch_freqs: [60]
  n_wavelets: 40
  downsample_fs: 100
  time_delay_sec: 0.2
  n_jobs: 1

windowing_lomtev:
  sample_len: 256
  stride: 1

split:
  val_frac: 0.0

model:
  name: nested_unet
  base_ch: 32
  kernel_size: 3
  decoder_kernel_size: 3
  dense_output: true
  dropout: 0.1

training:
  batch_size: 128
  epochs: 50
  optimizer: adam
  lr: 8.42e-5
  weight_decay: 1.0e-6
  scheduler: reduce_on_plateau
  scheduler_patience: 5
  scheduler_factor: 0.5
  early_stopping_patience: 15
  grad_clip_max_norm: 1.0
  loss: mse_cosine

evaluation:
  metric: pearson_r
  smooth_sigma_val: 1
  smooth_sigma_test: 1

logging:
  use_wandb: false
  tags: [bci4, nested_unet, deepfingernet, v3, dk3, dense_output]
